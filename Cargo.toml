[package]
name = "siphonix"
version = "0.1.0"
description = "Universal High-Performance Terminal Media Downloader"
authors = ["Chirag P Patil <cp099>"]
repository = "https://github.com/cp099/Siphonix"
homepage = "https://github.com/cp099"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time", "signal"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
inquire = "0.7"
indicatif = "0.17"
colored = "2.2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
regex = "1.11"
opener = { version = "0.7", features = ["reveal"] }
rand = "0.8"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"

[lib]
name = "siphonix_lib"
path = "src/lib.rs"

[[bin]]
name = "siphonix"
path = "src/main.rs"
